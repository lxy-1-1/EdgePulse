name: Verify EdgePulse
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - run: python -m pytest -q
      - run: node --check edgepulse/static/app.js
      - run: node scripts/test_ui_state.cjs
      - run: python -m build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock -e . playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py --channel chromium
